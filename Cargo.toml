[package]
name = "layer-math-photoshop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Bounded expression evaluator for Layer Math for Photoshop"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
